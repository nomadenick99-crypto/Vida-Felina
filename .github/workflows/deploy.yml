# Deploy de produção no GitHub Pages.
# A cada push na main (ex.: merge de uma release), o GitHub:
#   1. baixa o código;
#   2. instala as ferramentas de build (npm ci);
#   3. gera a versão de produção (npm run build -> dist/);
#   4. publica a pasta dist/ no GitHub Pages.
# Também pode ser executado manualmente pela aba Actions.

name: Deploy de produção

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissões mínimas para publicar no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; um deploy novo não cancela o que já está em andamento
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Gerar a build
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar o Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar as ferramentas de build
        run: npm ci

      - name: Gerar a versão de produção
        run: npm run build

      - name: Preparar o GitHub Pages
        uses: actions/configure-pages@v6

      - name: Enviar a pasta dist/
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Publicar no GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
